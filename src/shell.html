<title>Deal Quest</title>
<style>
/* Layout: a contractor's job file. Fixed side index on desktop, bottom tabs on phone, ledger figures in mono, chalk-line rules between sections. */
:root{--bg:#e8ece6;--panel:#f5f7f2;--ink:#14233a;--mute:#566273;--line:#c2cbc4;--chalk:#1b5bb8;--chalk-soft:#d6e2f3;--stamp:#f0c233;--stamp-ink:#3a2c00;--good:#1d6f4b;--good-soft:#d8ebdf;--bad:#a23a2c;--bad-soft:#f3dcd7;--warn:#8a6100;--warn-soft:#f6e9c5;
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--panel:#18222f;--ink:#e6ebe6;--mute:#9aa7b5;--line:#2f3c4c;--chalk:#7fb0f2;--chalk-soft:#1c3048;--stamp:#f0c233;--stamp-ink:#2b2100;--good:#6fce9f;--good-soft:#14322a;--bad:#ef9385;--bad-soft:#3b1f1b;--warn:#e7c469;--warn-soft:#352b12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1722;--panel:#18222f;--ink:#e6ebe6;--mute:#9aa7b5;--line:#2f3c4c;--chalk:#7fb0f2;--chalk-soft:#1c3048;--stamp:#f0c233;--stamp-ink:#2b2100;--good:#6fce9f;--good-soft:#14322a;--bad:#ef9385;--bad-soft:#3b1f1b;--warn:#e7c469;--warn-soft:#352b12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);margin:0}
a{color:var(--chalk)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.5rem,7vw,4.2rem)}h2{font-size:clamp(1.8rem,4vw,2.4rem)}h3{font-size:1.45rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 16px;border-right:2px solid var(--ink);display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font:800 2rem/.95 var(--display);text-decoration:none;color:var(--ink);display:block}
.brand span{background:var(--stamp);color:var(--stamp-ink);padding:0 5px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{display:block;padding:8px 10px;text-decoration:none;color:var(--ink);font-weight:700;border-left:4px solid transparent}
nav.tabs a:hover{background:var(--chalk-soft)}
nav.tabs a.on{border-left-color:var(--chalk);background:var(--panel)}
.sync{font:12px/1.4 var(--mono);color:var(--mute);margin-top:auto}
main{padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wide{max-width:1020px}
.eyebrow{font:600 12.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.lede{font-size:1.15rem;color:var(--mute);max-width:62ch;margin:0}
.chalk{border:0;border-top:2px dashed var(--chalk);margin:6px 0;opacity:.7}
.body{display:flex;flex-direction:column;gap:14px}.body p,.body ul,.body ol{margin:0;max-width:66ch}.body li{margin-bottom:6px}.body h3{margin-top:14px}
.body table,.tbl{border-collapse:collapse;width:100%;font-size:.93rem}
.tw{overflow-x:auto;max-width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{padding:12px 14px;border:1.5px solid;background:var(--panel)}
.note b.t{display:block;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.why{border-color:var(--chalk);background:var(--chalk-soft)}.why b.t{color:var(--chalk)}
.save{border-color:var(--good);background:var(--good-soft)}.save b.t{color:var(--good)}
.trap{border-color:var(--bad);background:var(--bad-soft)}.trap b.t{color:var(--bad)}
.check{border-color:var(--warn);background:var(--warn-soft)}.check b.t{color:var(--warn)}
.track{border-color:var(--ink);background:var(--panel);font-family:var(--mono);font-size:.88rem}
.file{border:2px solid var(--ink);background:var(--panel);position:relative}.file b.t{background:var(--stamp);color:var(--stamp-ink);display:inline-block;padding:1px 6px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:2px solid var(--ink);padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink)}
.btn:hover{background:var(--chalk);border-color:var(--chalk);color:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}
.bign{font:800 clamp(2.6rem,5.5vw,4.4rem)/.92 var(--display)}
.bign em{font-style:normal;color:var(--chalk)}
.ch{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:center}
.ch:hover{background:var(--panel)}
.ch .num{font:800 2.6rem/1 var(--display);color:var(--chalk)}
.ch small{display:block;color:var(--mute);font-size:.9rem;line-height:1.35}
.pct{font:600 13px var(--mono);white-space:nowrap}
.bar{height:7px;background:var(--line)}.bar i{display:block;height:100%;background:var(--good)}
.ll{display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.ll:hover{background:var(--panel)}
.stampd{font:600 12px var(--mono);white-space:nowrap}.stampd.done{color:var(--good)}
.q{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.q p.pr{margin:0;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);padding:9px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--chalk)}
.opt:disabled{cursor:default}.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}.opt.pick{border-color:var(--chalk);background:var(--chalk-soft)}
.ex{font-size:.95rem;color:var(--mute);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.88rem;min-width:0}
.fld span{color:var(--mute)}
input,select{background:var(--panel);border:1.5px solid var(--line);padding:7px 9px;width:100%;min-width:0}
td input,td select{padding:5px 6px;min-width:76px}
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.out{display:flex;flex-direction:column;gap:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font:600 12px var(--mono);padding:2px 7px;display:inline-block;white-space:nowrap}.pill.g{background:var(--good-soft);color:var(--good)}.pill.y{background:var(--warn-soft);color:var(--warn)}.pill.r{background:var(--bad-soft);color:var(--bad)}
.subt{display:flex;gap:6px;flex-wrap:wrap}.subt button{background:none;border:1.5px solid var(--line);padding:6px 11px;cursor:pointer;font-weight:700}.subt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flash{min-height:230px;border:2px solid var(--ink);background:var(--panel);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;text-align:left;width:100%}
.flash strong{font:800 2.1rem/1.05 var(--display)}
svg text{fill:var(--ink);font-family:var(--mono)}
.foot{font-size:.85rem;color:var(--mute);max-width:66ch}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;border:0;border-bottom:2px solid var(--ink);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));flex-direction:row;align-items:center;justify-content:space-between}.brand{font-size:1.5rem}.brand br{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--ink);flex-direction:row;justify-content:space-around;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}nav.tabs a{padding:7px 5px;font-size:.78rem;border-left:0;border-bottom:3px solid transparent}nav.tabs a.on{border-bottom-color:var(--chalk);background:none}.sync{margin:0;max-width:120px;text-align:right}
.hero,.tool{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}.ch{grid-template-columns:40px minmax(0,1fr) auto}.ch .num{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
<div class="shell"><aside class="side"><a class="brand" href="#home">518<br> <span>BRRRR</span></a><nav class="tabs" aria-label="Main"></nav><div class="sync" id="sync">Saving on this device</div></aside><main id="m"></main></div>
